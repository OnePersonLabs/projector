name: Projector operations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governed-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/task19-dogfood.mjs
      - run: pnpm verify
      - run: pnpm build
