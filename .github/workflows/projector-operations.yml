name: Projector operations

on:
  workflow_dispatch:

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm acceptance:knowledge
      - run: pnpm verify
      - run: pnpm release:artifacts:check
      - run: node scripts/build-source-severed-release-bundle.mjs .temp/release-candidate
      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: projector-release-candidate
          path: .temp/release-candidate
          if-no-files-found: error
          retention-days: 7

  source-severed-acceptance:
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download exact release candidate without a checkout
        uses: actions/download-artifact@v4
        with:
          name: projector-release-candidate
          path: candidate
      - name: Accept downloaded source-severed candidate
        run: node candidate/source-severed-release-acceptance.mjs candidate
      - name: Upload exact accepted artifacts and evidence
        uses: actions/upload-artifact@v4
        with:
          name: projector-2.1.0-accepted-${{ matrix.os }}
          path: |
            candidate/artifacts
            candidate/plugin
            candidate/manifest.json
            candidate/results/packed-held-out-lifecycle.json
            candidate/results/packed-held-out-lifecycle-transcript.json
            candidate/results/digests.json
          if-no-files-found: error
          retention-days: 14
