name: Projector operations

on:
  workflow_dispatch:

jobs:
  governed-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Provision capability-proven Ubuntu sandbox
        run: bash .github/scripts/provision-ubuntu-sandbox.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prove sandbox isolation
        run: node scripts/probe-sandbox.mjs
      - run: node scripts/task19-dogfood.mjs
      - run: pnpm verify
      - run: pnpm release:artifacts:check
      - run: pnpm release:acceptance
