#:schema ../schemas/canonical-authority-record-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "authority-record"
id = "authority:persisted-project-artifact-format"
key = "persisted-project-artifact-format-authority"
lifecycle = "approved"

[payload]
subjectId = "concern:persisted-project-artifact-format"
conclusion = "migrate"
rationale = """The user explicitly selected TOML on September 10, 2026 for human-authored Projector configuration and \
  canonical artifacts, while retaining JSON for useful machine or external contracts and SQLite for \
  suitable derived state. Readability includes stable identity-derived filenames, deliberate ordering, \
  multiline prose, local versioned editor schemas, and ordinary edits that do not require manual fingerprint \
  repair. Semantic hashes compare normalized parsed values; exact bytes remain separately bound only \
  where reviewed mutation, executable input, or recovery requires equality. This authority selects a \
  format boundary, not correctness, acceptance, provenance, authorization, or universal editor support. \
  Reaffirmed after the engineering-English requirement revision and integrated shared-schema expansion \
  at main 7b0b01c. Current context knowledge_context_13c8d763d659dcf5a80b04a3f3234cb2 (sha256:v1:d558411000e407401e0f779b6c4e5ed913c8d763d659dcf5a80b04a3f3234cb2) \
  records assessment sha256:v1:5b502ac61ec3e574da27a7f48f831d91d14a71dc9ec3a7ddfa0582ace72e0a02: the \
  requirement-change trigger fired while the format scope and durable-meaning dependency remained current \
  and no assumption was invalidated. Core typecheck, 43 focused contract tests, and package boundaries \
  passed. The new typed schemas remain inside the accepted schema-authority boundary. This does not \
  claim that TOML conversion, editor delivery, readiness, or migration is complete."""
assumptions = [ "The executable typed contracts remain the sole schema authority.", "Projector can package exact generated schemas and copy them into an adopting repository during initialization or preparation.", "A maintained TOML implementation can round-trip every supported typed value on Node 24.", "Machine-owned journals, receipts, external contracts, and derived SQLite state remain useful in JSON or SQLite rather than being converted for appearance." ]
assessmentConfidence = "high"
governanceRiskClass = "R2"
decidedBy = "user"
createdAt = "2026-09-10T00:00:00Z"

[[payload.alternatives]]
key = "canonical-json-everywhere"
description = "Keep configuration and accepted canonical artifacts as compact JSON with hash-derived filenames."
advantages = [ "Matches the current parser and serializer.", "Keeps one machine-oriented representation." ]
disadvantages = [ "Current files and names are difficult for people to inspect and edit.", "Extending the current copied hash fields would preserve needless maintenance." ]
rejectedBecause = [ "The user selected human-readable authored artifacts and asked to remove needless hash maintenance." ]
evidence = []

[[payload.alternatives]]
key = "permanent-dual-format"
description = "Read and write both JSON and TOML indefinitely."
advantages = [ "Avoids an immediate cutover." ]
disadvantages = [ "Creates two live representations and ambiguous ownership.", "Keeps conversion and divergence machinery in the shipped product." ]
rejectedBecause = [ "The user waived a permanent converter or compatibility layer for Projector's one-time conversion." ]
evidence = []

[[payload.alternatives]]
key = "yaml-authored-artifacts"
description = "Use YAML for the human-authored source files."
advantages = [ "Supports comments and multiline text." ]
disadvantages = [ "Introduces a broader and less deliberately selected syntax surface." ]
rejectedBecause = [ "The user explicitly selected TOML." ]
evidence = []

