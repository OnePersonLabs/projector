#:schema ../schemas/canonical-authority-record-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "authority-record"
id = "authority:project-data-readiness-and-migration"
key = "project-data-readiness-and-migration-authority"
lifecycle = "approved"

[payload]
subjectId = "concern:project-data-readiness-and-migration"
conclusion = "migrate"
rationale = """The user requires installed Projector operations to prepare compatible project data automatically before \
  strict loaders run, with numeric SemVer chains, checksummed immutable migrations, exclusive migration \
  access, a verified full backup under the user's Codex data directory, recoverable staging and publication, \
  and configuration updated last. Existing transaction journals and receipts are durable recovery evidence, \
  not disposable caches. A new version marker cannot stop an older already-running process that does \
  not participate in the new protocol; the legacy transition therefore requires an explicit supported \
  restart/quiescence disposition and a held-old-process negative test before promotion.

Reaffirmed for this canonical meaning transaction after reviewing the durable-meaning and reverse-reconciliation \
  revisions. They preserve exclusive access, authenticated backup, Pending, journal, receipt, recovery, \
  and release-selected migration ownership; this transaction changes no source authority, target descriptor, \
  or access assumption. Current retained context knowledge_context_6204acbaff99f456aa7e24800a87b41d \
  (sha256:v1:5290553931fc3960115742786629db7b6204acbaff99f456aa7e24800a87b41d) supplies the exact current \
  repository and canonical observation. This reaffirmation does not claim complete implementation or \
  economic advantage."""
assumptions = [ "All compatible installed runners honor the shared operation-access protocol after the converted baseline.", "The host can resolve a writable user Codex data directory for verified backups.", "The existing writer lease and transaction journal remain the canonical mutation exclusion and recovery mechanisms inside ordinary governed writes.", "The one-time legacy conversion can require a supported process or session restart because older code cannot be retroactively fenced." ]
assessmentConfidence = "high"
governanceRiskClass = "R2"
decidedBy = "user"
createdAt = "2026-09-10T00:00:00Z"

[[payload.alternatives]]
key = "strict-loader-before-readiness"
description = "Let current loaders fail first and require users to invoke a separate manual upgrade."
advantages = [ "Keeps operation entry points small." ]
disadvantages = [ "Makes ordinary operations fail before they can report or repair compatibility.", "Leaves upgrade behavior inconsistent across entry points." ]
rejectedBecause = [ "Readiness must run before strict current loaders at every public operation entry." ]
evidence = []

[[payload.alternatives]]
key = "stamp-current-first"
description = "Write the current package version before migrating project data."
advantages = [ "Makes version inspection simple after startup." ]
disadvantages = [ "A crash can hide incomplete publication behind version equality.", "Recovery cannot distinguish prepared from fully published state." ]
rejectedBecause = [ "Configuration is updated last and a durable pending marker survives interruption." ]
evidence = []

[[payload.alternatives]]
key = "version-check-only-exclusion"
description = "Treat the new version check or access heartbeat as sufficient to fence old processes."
advantages = [ "Avoids a restart requirement." ]
disadvantages = [ "Already-running old code need not read or honor the new marker.", "It cannot establish writer quiescence for the first legacy upgrade." ]
rejectedBecause = [ "The previous installed runner must be held across an upgrade test and receive a supported restart, refusal, or recovery disposition that prevents corruption." ]
evidence = []

[[payload.alternatives]]
key = "permanent-first-cutover-migrator"
description = "Ship a sealed migration and legacy compatibility reader for Projector's own JSON-to-TOML conversion."
advantages = [ "Reuses the future migration machinery for the initial conversion." ]
disadvantages = [ "Permanently carries a one-time internal transition and dual-format premise." ]
rejectedBecause = [ "The user explicitly waived a formal migrator for the one-time conversion; the permanent framework starts from the verified converted baseline." ]
evidence = []

