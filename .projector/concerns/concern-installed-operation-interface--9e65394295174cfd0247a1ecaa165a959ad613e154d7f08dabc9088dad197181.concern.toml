#:schema ../schemas/canonical-architecture-concern-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "architecture-concern"
id = "concern:installed-operation-interface"
key = "installed-operation-interface"
lifecycle = "resolved"

[payload]
title = "Installed Projector operation interface"
question = """How do installed skills and hooks invoke supported Projector operations with one typed contract, readiness \
  and recovery on native Windows and direct WSL?"""
sourceClass = "authored"
materiality = "blocking-now"
activationReasons = []
relatedConceptIds = [ "concept:representation-responsibility-boundary" ]
relatedRequirementIds = [ "requirement:pre-edit-relevance", "requirement:reverse-reconciliation", "requirement:evidence-bound-completion", "requirement:self-hosted-value" ]
decisionIds = [ "decision:bundled-operation-runner" ]
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/core/src/schemas/operations.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/core/src/schemas/registry.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/core/src/index.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/core/src/domain/contracts.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/cli/src/operation-runner.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/readiness/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "scripts/build-plugin-runtime.mjs"
