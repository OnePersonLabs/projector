#:schema ../schemas/canonical-architecture-concern-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "architecture-concern"
id = "concern:persisted-project-artifact-format"
key = "persisted-project-artifact-format"
lifecycle = "resolved"

[payload]
title = "Persist human-authored Projector artifacts readably"
question = """Which persisted formats, filenames, schemas, and hash meanings let people edit Projector configuration \
  and accepted artifacts without weakening machine validation, state binding, or recovery?"""
sourceClass = "authored"
materiality = "blocking-now"
activationReasons = []
relatedConceptIds = [ "concept:human-readable-persisted-artifacts", "concept:reconstruction-authority" ]
relatedRequirementIds = [ "requirement:durable-meaning", "requirement:engineering-english", "requirement:scoped-invalidation" ]
decisionIds = [ "decision:persisted-project-artifact-format" ]
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = ".projector/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/core/src/domain/contracts.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/core/src/hashing/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/core/src/schemas/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/activation/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/persistence/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "scripts/generate-*schema*"
