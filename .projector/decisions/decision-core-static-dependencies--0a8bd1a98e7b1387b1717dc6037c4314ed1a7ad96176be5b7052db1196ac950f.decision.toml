#:schema ../schemas/canonical-architecture-decision-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "architecture-decision"
id = "decision:core-static-dependencies"
key = "core-static-dependencies-decision"
lifecycle = "active"

[payload]
concernId = "concern:core-host-independence"
title = "Keep core independent of implementation packages"
decision = """Core source may use its external libraries but must not statically import implementation packages in \
  this repository. Check observed import syntax; accept alternate implementations that satisfy the same \
  boundary."""
selectedOptionKey = "static-boundary-lens"
authorityRecordId = "authority:core-host-independence-decision"
consequences = []
appliedPreferences = []
supersedesDecisionIds = []

[payload.scope]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/core/src/**"

[[payload.governanceBasis]]
kind = "adopted-standard"
authorityRecordId = "authority:core-host-independence-decision"
