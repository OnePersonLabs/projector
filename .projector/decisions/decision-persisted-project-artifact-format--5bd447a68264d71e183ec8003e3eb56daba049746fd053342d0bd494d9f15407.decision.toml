#:schema ../schemas/canonical-architecture-decision-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "architecture-decision"
id = "decision:persisted-project-artifact-format"
key = "persisted-project-artifact-format-decision"
lifecycle = "active"

[payload]
concernId = "concern:persisted-project-artifact-format"
title = "Use typed TOML for authored project artifacts"
decision = """Use TOML for human-authored Projector configuration and canonical artifacts. Keep machine or external \
  contracts in JSON when that remains useful and keep SQLite derived. Give canonical files readable, \
  deterministic filenames derived from stable record identities; keys aid discovery but do not own paths. \
  Serialize with deliberate field ordering and readable multiline prose. Parse TOML to values and validate \
  those values with the existing typed Zod contracts at runtime. Generate explicit versioned JSON Schemas \
  from those same contracts, package the exact bundle, copy it to `.projector/schemas`, and add a document-relative \
  Taplo `#:schema` header to every authored TOML file without editing user `.taplo.toml`. Compute semantic, \
  discovery, and canonical value hashes from normalized parsed values so comments and formatting do \
  not affect meaning or currentness. Preserve exact-byte checks in authenticated plans, executable inputs, \
  and recovery journals. Ordinary authored edits require no manual hash maintenance, while parsing or \
  hash agreement does not establish correctness, reviewed acceptance, approval, authorization, fidelity, \
  or provenance. A Projector rewrite need not preserve arbitrary comment placement or lexical ordering. \
  Runtime validation works without an editor; automatic schema association is supported only where Taplo-compatible \
  tooling is installed, and semantic validation errors guarantee file and field paths rather than source \
  spans."""
selectedOptionKey = "typed-toml-authored-machine-json-derived-sqlite"
authorityRecordId = "authority:persisted-project-artifact-format"
appliedPreferences = []
supersedesDecisionIds = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = ".projector/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "packages/core/src/domain/contracts.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/core/src/hashing/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/core/src/schemas/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/activation/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/persistence/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "scripts/generate-*schema*"

[[payload.governanceBasis]]
kind = "adopted-standard"
authorityRecordId = "authority:persisted-project-artifact-format"

[[payload.consequences]]
kind = "introduce-constraint"
targetId = "concept:human-readable-persisted-artifacts"
explanation = """The accepted constraint owns the required authored-format, schema, and hash behavior independently of \
  implementation status."""

[[payload.consequences]]
kind = "advisory"
explanation = """Task 6A converts Projector's own authored files once only after the new reader, writer, schemas, and \
  runtime validation work; it does not ship a permanent dual reader, converter, or sealed migration \
  for that cutover."""

[[payload.consequences]]
kind = "advisory"
explanation = """The conversion preserves parsed identities, relationships, accepted meaning, rationale, and unrealized \
  commitments, while journals and receipts retain their existing authentication semantics."""
