#:schema ../schemas/canonical-architecture-decision-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "architecture-decision"
id = "decision:project-data-readiness-and-migration"
key = "project-data-readiness-and-migration-decision"
lifecycle = "active"

[payload]
concernId = "concern:project-data-readiness-and-migration"
title = "Prepare project data before every public operation"
decision = """Give every public operation a bounded metadata readiness inspection before strict model or database \
  loading. Missing activation remains inactive and inspection does not create `.projector`, initialize \
  SQLite or the model, or execute validators. Initialization uses an explicit bootstrap route that stages \
  owned outputs and publishes configuration last. Active ordinary operations hold shared operation access \
  for their whole lifetime; migration holds exclusive access, resolves unfinished governed transactions \
  first, and retains existing writer-lease and journal behavior without nested acquisition. Add `projectorVersion` \
  as the package release that successfully prepared the project, separate from config API, canonical \
  schema, runtime evidence and representation versions, and SQLite schema. Accept only a validated legacy-unversioned \
  baseline and ordered checksummed numeric-SemVer migration chains. Support upgrades across multiple \
  releases only by traversing the full ordered verified chain; reject missing or invalid chain links, \
  unknown or mixed versions, newer formats, tampering, and unsupported transitions without stamping \
  current. Before mutation, create and verify a full safe `.projector` backup beneath the user's Codex \
  data directory, including durable journals and receipts and consistent SQLite/WAL handling. Migrate \
  in staging, validate source and target, publish with a durable pending marker, and update config last. \
  Recovery recognizes exact migration bytes, preserves unexpected edits and backups, and returns the \
  recovery location. Establish the permanent released format baseline only from Projector's verified \
  TOML-converted files. Maintain one explicit net-change draft, seal immutable migrations and transform \
  dependencies into the packaged plugin, and block outgoing revisions or release artifacts when persisted \
  owner changes are unexplained. Ordinary edits to canonical content are not format migrations. Cooperative \
  locks do not prove that legacy code is quiescent; the first conversion requires a supported restart \
  disposition and held-old-runner corruption-negative evidence.

Bounded observation and disposable-cache eviction preserve these readiness, backup, migration and recovery \
  guarantees. Run cache collection only through nonblocking exclusive access outside ordinary shared \
  claims; never upgrade a held shared claim. Authenticate the complete protected lifecycle dependency \
  set before eviction. Capacity exhaustion fails cache admission and cannot authorize deletion of recovery \
  evidence. Incompatible analysis baselines require fresh context, not migration of historical approvals \
  or replay of committed effects."""
selectedOptionKey = "bounded-readiness-exclusive-recoverable-migration"
authorityRecordId = "authority:project-data-readiness-and-migration"
appliedPreferences = []
supersedesDecisionIds = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = ".projector/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/access/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/activation/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/journal/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/migrations/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/sqlite/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/worktrees/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/readiness/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/migrations/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/cli/src/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/hooks/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/scripts/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "scripts/build-plugin-runtime.mjs"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "scripts/*migration*"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "scripts/*release*"

[[payload.governanceBasis]]
kind = "adopted-standard"
authorityRecordId = "authority:project-data-readiness-and-migration"

[[payload.consequences]]
kind = "introduce-constraint"
targetId = "concept:safe-project-data-readiness"
explanation = """The accepted constraint owns readiness, exclusion, backup, publication, and recovery requirements independently \
  of implementation status."""

[[payload.consequences]]
kind = "advisory"
explanation = """Readiness reports inactive, upgrade-required, recovery-required, busy, or unavailable without converting \
  those states into false success."""

[[payload.consequences]]
kind = "advisory"
explanation = """The migration authoring and outgoing-revision check are the requested release safety mechanism; this \
  decision does not authorize a new general registry, workflow store, or unrelated repository-wide guard."""
