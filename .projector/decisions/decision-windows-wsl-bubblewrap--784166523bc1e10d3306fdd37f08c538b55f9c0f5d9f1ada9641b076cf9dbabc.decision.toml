#:schema ../schemas/canonical-architecture-decision-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "architecture-decision"
id = "decision:windows-wsl-bubblewrap"
key = "windows-wsl-bubblewrap"
lifecycle = "active"

[payload]
concernId = "concern:cross-platform-validation-sandbox"
title = "Use host-configured native execution with explicit integrity checks"
decision = """Execute Projector operations and validators through the host's configured permissions, using the native \
  Node runner on Windows and the Linux Node runner for direct WSL. Projector does not require WSL bridging \
  or provide a confinement backend. Preserve exact reviewed mutation authority, actual source/state/version \
  checks, validator provenance and bytes, bounded time/output, caller cancellation and journaled recovery. \
  Report only guarantees that the selected execution path establishes; unavailable required controls \
  stop the affected operation rather than becoming optimistic evidence."""
selectedOptionKey = "host-configured-native-runner"
authorityRecordId = "authority:windows-wsl-bubblewrap"
appliedPreferences = []
supersedesDecisionIds = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/execution/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/change-lifecycle/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/coverage/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/cli/src/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/scripts/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/hooks/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "scripts/build-plugin-runtime.mjs"

[[payload.governanceBasis]]
kind = "adopted-standard"
authorityRecordId = "authority:windows-wsl-bubblewrap"

[[payload.consequences]]
kind = "introduce-constraint"
targetId = "concept:controlled-validation-isolation"
explanation = "The host-execution integrity contract remains accepted meaning across runner and host changes."
