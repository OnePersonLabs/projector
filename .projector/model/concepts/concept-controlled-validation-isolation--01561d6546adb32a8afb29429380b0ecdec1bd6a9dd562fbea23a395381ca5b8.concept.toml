#:schema ../../schemas/canonical-concept-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "concept"
id = "concept:controlled-validation-isolation"
key = "controlled-validation-isolation"
lifecycle = "active"

[payload]
kind = "constraint"
name = "Validation integrity with native Windows write restrictions"
aliases = [ "host-executed-validation" ]
statement = """Projector executes operations and validators through the host's configured permissions. It must preserve \
  exact reviewed mutation authority, validator provenance and bytes, actual source/state/version checks, \
  bounded time and output, caller cancellation, observed results, and journaled recovery. Native Windows \
  runs repository Node validators through Codex's unelevated read-only permission profile without a model \
  call, login, or administrator setup; direct WSL uses its Linux Node runner. Missing or failed Windows \
  sandbox execution stops validation without an unsandboxed retry. Operations retain native host execution. \
  Projector requires neither a WSL bridge nor a private confinement backend. Unelevated validation restricts \
  writes but does not establish read isolation or network denial, and Node children with piped stdio are \
  unsupported; inherited stdio is supported. Report host permissions and unsupported controls honestly. An ordinary \
  process is not a security boundary, and hashes or pinned inputs do not prevent malicious same-user \
  interference."""
sourceClass = "authored"
confidence = 1
tags = [ "integrity", "host-execution", "cross-platform" ]
evidence = []
