#:schema ../../schemas/canonical-concept-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "concept"
id = "concept:controlled-validation-isolation"
key = "controlled-validation-isolation"
lifecycle = "active"

[payload]
kind = "constraint"
name = "Host-executed validation integrity"
aliases = [ "host-executed-validation" ]
statement = """Projector executes operations and validators through the host's configured permissions. It must preserve \
  exact reviewed mutation authority, validator provenance and bytes, actual source/state/version checks, \
  bounded time and output, caller cancellation, observed results, and journaled recovery. Native Windows \
  uses its Node runner and direct WSL uses its Linux Node runner; Projector requires neither a WSL bridge \
  nor its own confinement backend. Report host permissions and unsupported controls honestly. An ordinary \
  process is not a security boundary, and hashes or pinned inputs do not prevent malicious same-user \
  interference."""
sourceClass = "authored"
confidence = 1
tags = [ "integrity", "host-execution", "cross-platform" ]
evidence = []
