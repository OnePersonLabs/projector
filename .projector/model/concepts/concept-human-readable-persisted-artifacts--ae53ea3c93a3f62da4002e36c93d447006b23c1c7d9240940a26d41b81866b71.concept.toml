#:schema ../../schemas/canonical-concept-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "concept"
id = "concept:human-readable-persisted-artifacts"
key = "human-readable-persisted-artifacts"
lifecycle = "active"

[payload]
kind = "constraint"
name = "Human-readable persisted artifacts"
aliases = [ "authored TOML", "readable canonical files", "semantic artifact hashing" ]
statement = """Human-authored Projector configuration and canonical artifacts use typed TOML, readable stable identity-derived \
  filenames, deliberate ordering, readable multiline prose, and document-relative local versioned schema \
  directives. Runtime parsing validates the same executable typed contracts without requiring an editor. \
  Semantic and discovery currentness derives from normalized parsed values; exact bytes are bound separately \
  only for reviewed mutation, executable input, and recovery. Machine-owned JSON and derived SQLite \
  remain when useful. Hash agreement establishes no correctness, approval, authorization, fidelity, \
  or provenance."""
sourceClass = "authored"
confidence = 1
tags = [ "persistence", "readability", "toml", "hashing" ]
evidence = []
