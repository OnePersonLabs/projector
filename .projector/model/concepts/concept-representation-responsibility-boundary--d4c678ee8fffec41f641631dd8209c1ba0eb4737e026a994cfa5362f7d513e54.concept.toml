#:schema ../../schemas/canonical-concept-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "concept"
id = "concept:representation-responsibility-boundary"
key = "representation-responsibility-boundary"
lifecycle = "active"

[payload]
kind = "constraint"
name = "Representation responsibility boundary"
aliases = [ "instruction inspection boundary", "plan-bound representation" ]
statement = """Conceptual reading renders accepted meaning and provenance without creating mutation authority. Inspection \
  of execution instructions additionally binds exact rendered bytes to the selected plan revision, capsule, \
  normative kernel, representation profile and state dependencies, and retains approval identity and \
  status when one exists; inspection must also work before approval. Authorized execution separately \
  requires a current authenticated approval and live dependency validation. Report artifact integrity, \
  dependency freshness, semantic fidelity, execution authorization and delivery as separate facts. Unknown \
  currentness never grants permission. Returning exact instructions to an active runner or tool channel \
  proves that delivery stage only, not agent understanding, compliance or behavioral success."""
sourceClass = "authored"
confidence = 1
tags = [ "representation", "execution", "currentness" ]
evidence = []
