[payload]
title = "Recognize project change intent before implementation"
aliases = []
statement = """For a Projector-active target, recognize proposed changes to behavior, architecture, requirements, or \
  shipped skills before dependent implementation, including proposals introduced by the agent, a target \
  discovered late in a turn, or a capability change discovered midway through implementation. Retrieve \
  accepted meaning and use the existing canonical change lifecycle when intended meaning changes. Carry \
  forward existing user authorization. Planning-only discussions stay in planning; speculative ideas \
  are not accepted requirements. Hook guidance is advisory and model interpretation owns meaning; do \
  not classify intent through keyword matching or transcript parsing."""
