[payload]
title = "Investigate accepted drift requests outside the main context"
aliases = []
statement = """After the user accepts an investigation offer or requests reconciliation, delegate a compact assignment \
  to a dedicated subagent using existing Projector services. Compare saved reasoning dependencies against \
  current evidence when available; otherwise inspect current design and state that files alone cannot \
  recover historical intent. Preserve work and return concise findings with evidence references. Investigation \
  does not authorize repair or new accepted meaning. Root continues independent work; coordinate overlapping \
  files and decisions before writes. Subagents relay material questions with options and recommendations \
  to the root, which uses request_user_input and relays answers. Retain unanswered questions and update \
  an existing investigation for new evidence rather than duplicating it."""
