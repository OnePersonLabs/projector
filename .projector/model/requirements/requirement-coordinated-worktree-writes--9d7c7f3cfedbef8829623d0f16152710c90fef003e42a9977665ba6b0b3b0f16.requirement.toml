[payload]
title = "Coordinate participating writers of shared governed state"
aliases = []
statement = """Parallel workers may inspect, research, validate or prepare isolated patches. Participating governed \
  writers affecting the same worktree and shared canonical or governed source state use one transaction \
  coordinator for final mutation. At most one writer lease governs that worktree, binding process/session \
  identity, acquisition time, relevant dependency-scoped state and compiled-against snapshot identity, \
  heartbeat or stale-lock recovery information, and explicit release. Isolated worktrees may run independent \
  write-heavy packets with their own leases. Workers return proposed canonical authority/lens/rule deltas \
  for coordinator integration; inspection or preparation grants no mutation authority.

Apply ownership to actual affected shared state and the participating-writer protocol, not every filesystem \
  artifact. Independently owned per-attempt runtime observations and evidence outputs do not require \
  a new global source-writer lock merely because they persist. Preserve accepted lifetime shared operation \
  access, exclusive migration access and existing writer-lease/journal behavior without nested acquisition. \
  Independent output ownership cannot bypass coordination when an operation actually mutates shared \
  governed state.

Historical blanket coordinator wording is limited by accepted host execution/readiness policy: this \
  is cooperative integrity, not confinement or exclusion of hostile same-user code, nonparticipating \
  legacy processes or arbitrary host edits. Native Node and host-configured permissions remain supported; \
  no mandatory sandbox or WSL bridge is reintroduced. Hashes and leases do not prove interference impossible. \
  The purpose is to prevent participating shared-state writers corrupting each other without serializing \
  unrelated observation artifacts or inventing a security backend.

This is a current governed execution/recovery obligation, not deferred future work. Existing leases/coordinators \
  are candidate implementation evidence; exact consumer and conflict/recovery evidence must establish \
  fulfillment. Broader distributed or hostile-writer exclusion lies outside this cooperative contract \
  and requires a new explicit requirement and trust decision."""
sourceClass = "authored"
realizations = []
evidence = []

