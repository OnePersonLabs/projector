#:schema ../../schemas/canonical-requirement-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "requirement"
id = "requirement:durable-meaning"
key = "durable-meaning"
lifecycle = "active"

[payload]
title = "Durable conceptual operations"
aliases = [ "conceptual operations", "stable meaning", "semantic identity" ]
statement = """Retain accepted meaning under stable identities across changes and sessions. Reuse an existing Requirement \
  or Scenario when it owns the meaning. Treat wording, aliases, paths, and similarity as discovery evidence; \
  they cannot by themselves prove semantic equivalence or authorize a new identity. Preserve explicit \
  split, merge, replacement, and deletion history.

Keep the semantic core provider-neutral. Agent and model output remains a candidate until deterministic \
  policy or explicit acceptance promotes it; resampling cannot mutate accepted architecture or redefine \
  identity. Fine-grained storage, filenames, sharding, wording, and implementation replacement do not \
  change stable identity, meaning, relations, or lineage.

The conceptual model owns intended behavior. Code and implementation plans are revisable realizations. \
  Incremental projection is a practical efficiency choice, not a requirement to preserve generated code. \
  Planning and implementation inform each other. Feed discoveries back into an explicit model revision \
  when intended behavior changes. Critically assess revisions against preserved behavior, constraints, \
  data safety and recovery, rather than conformance to an earlier procedure. Keep unresolved meaning \
  explicit. Evaluate projection, verification and maintenance effort together; a report or internally \
  consistent model does not establish net benefit."""
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/engine/src/identity/**"

[[payload.scope.items]]
