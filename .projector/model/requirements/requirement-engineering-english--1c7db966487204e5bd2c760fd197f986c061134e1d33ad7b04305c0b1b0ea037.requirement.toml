kind = "requirement"
id = "requirement:engineering-english"
key = "engineering-english"
lifecycle = "active"

[payload]
title = "Express one meaning for humans and agents"
aliases = [ "simplified engineering English", "controlled English" ]
statement = """Keep human-readable engineering statements precise and concise while preserving identity, normative \
  force, negation, scope, quantifiers, conditions, exceptions, dependency order, and scenario roles. \
  Derive compact agent context and exact execution instructions from the same accepted meaning and rendering/provenance \
  machinery. Ordinary conceptual reading, inspection of plan-bound instructions, and authorized execution \
  remain distinct operations: reading requires no invented mutation approval, an internally consistent \
  or historical artifact is not thereby current, and inspection or delivery does not authorize execution. \
  Do not maintain competing specifications that require manual synchronization.

Every human or agent projection binds the source semantic hash and profile. Compact context preserves \
  exact identifiers, tokens, numbers, units, scope, order, negation, conditions, exceptions, biconditionals, \
  and cardinality. Ambiguous, weaker, or measured net-negative compression falls back to the least-compressed \
  adequate form with weaker-capability disclosure. Style checks and prose cannot establish truth, equivalence, \
  or hard-rule enforcement.

Representation machinery and deterministic operation primitives have separate responsibilities: compact \
  representation never grants mutation authority. Prefer a suitable registered deterministic operation \
  over an equivalent raw handwritten edit, within its authorized scope and the accepted host-operation \
  runner. Retain operation categories reached by supported workflows; the historical mandatory primitive \
  catalog and separate command or CLI delivery prescription are superseded by the registered runner. \
  Unsupported insert, rename, Markdown-editing, or workflow primitives remain explicitly unrealized, \
  and are reconsidered only when an actual supported workflow requires the missing operation and its \
  preview, state, effect, evidence, and recovery contract. This does not revive Projector-owned confinement, \
  mandatory WSL, or the historical network enum.

Verify representation behavior through direct fidelity, association, currentness and recovery checks. \
  A real installed host exercise checks delivery and the resulting action where automated tests cannot \
  observe the host. Reuse relevant checks when their dependencies remain unchanged. Do not require a \
  newly certified seven-stage report or a transcript parser for every release. Hashes identify exact \
  inputs and outputs; they do not establish truth or agent understanding. Amend verification methods \
  when a critically reviewed alternative preserves the consequential failure protections with less total \
  effort."""
sourceClass = "authored"
evidence = []

