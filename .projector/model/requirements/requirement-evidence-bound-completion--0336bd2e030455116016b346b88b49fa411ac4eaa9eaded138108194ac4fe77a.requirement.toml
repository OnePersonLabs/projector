[payload]
title = "Expose remaining design obligations progressively"
aliases = []
statement = """Report finite observed coverage populations and distinguish mapping from fulfillment. Preserve accepted \
  capabilities before implementation exists. Rank concrete unresolved obligations and repair questions \
  using observed effect and blocking status, with stable issue identity and state-bound evidence. Accepted \
  meaning, satisfied predicates or an explicit valid deferral may settle an issue; relevant new facts \
  reopen it without reopening unrelated decisions. A cleanup plan must identify actionable repairs and \
  cannot claim execution or a complete design from unavailable evidence.

An agent's assertion that work is done is non-normative. Completion requires current bindings, reconciled \
  affected units, required evidence, allowed unknowns, and explicit unavailable external actions. Evidence \
  identifies its lane, source, independence, side effects, and assurance; tests produced by the same \
  packet or sharing the same flawed suite are correlated, and a model cannot solely validate its own \
  compression. Release proof binds stable obligation IDs to observed results from the same revision \
  and worktree with distinct negative controls; self-report, caller counts, hash-shaped strings, and \
  default-zero metrics do not count.

Separate exclusion policy for inventory, inference authority, mutation, reporting, model context, and \
  coverage denominator. A single ignore rule must not silently erase an artifact from every semantic \
  role. Vendored code may remain inventoried for dependencies while excluded from mutation and pattern \
  authority; generated outputs may remain in reconciliation while excluded as independent authority \
  evidence; secrets or configuration values may be inventoried structurally while excluded from model \
  context. Apply this obligation together with executable-lens authority and scoped-invalidation obligations.

Governance audit must expose contradictions, unreachable selectors, excessive exceptions, duplicate \
  or semantically equivalent rules, overbroad selectors, stale authority triggers, blocking rules without \
  executable predicates or validators, deterministic mechanics expressed only in prose, transforms lacking \
  idempotency evidence, disproportionate invalidation, and rule or model growth whose maintenance cost \
  exceeds prevented divergence. An unavailable or unevaluable check remains unknown rather than passing.

These layered-exclusion and complete rule-pressure capabilities remain active but explicitly unrealized \
  as public workflows by this ingestion: existing types, mappings, and implementation surfaces do not \
  establish their consumers. Reconsider the exclusion carrier when a supported inventory, coverage, \
  mutation, or context workflow needs purpose-specific treatment, and reconsider each audit check when \
  an installed audit or coverage workflow needs its result and conservative unknown disclosure. Preserve \
  these prerequisites in completion and context until observed consumer evidence justifies realization.

Audit, completion, migration and interrupted transactions must yield resumable cleanup/continuation \
  plans. Required bounded saved-context and lifecycle continuation reports current/stale/unknown evidence, \
  missing advisory notes/artifacts, unresolved work, recovery-required state and the supported next \
  action through existing services and the shared runner. Explain relevant query/profile changes while \
  retaining independently current work, including fresh-session checks. This remains release work; unrestricted \
  multi-packet limitations do not defer it. Do not create a parallel progress store. Exceptions and \
  general overlays remain discoverable under their dedicated requirements until actual consumers are \
  demonstrated. Non-goals limit promises, not future implementation commitments. Coverage preserves \
  denominator assumptions, open-world limits and unavailable analyzers rather than implying exhaustive \
  coverage."""
sourceClass = "authored"
evidence = []

