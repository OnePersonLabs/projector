#:schema ../../schemas/canonical-requirement-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "requirement"
id = "requirement:executable-lenses"
key = "executable-lenses"
lifecycle = "active"

[payload]
title = "Make architectural knowledge executable"
aliases = [ "architectural lenses", "predicate constrained implementations" ]
statement = """An active architectural lens must select relevant observed units and contribute executable constraints \
  or validators with explicit authority and assumptions. For handwritten code, accept different implementations \
  that satisfy the predicates. Require exact output only when the lens explicitly owns deterministic \
  generation. A prose description or an unregistered validator cannot establish conformance."""
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/engine/src/governance/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge-governance.ts"

[[payload.origin]]
kind = "user-request"
locator = "projector-recovered-premise:2026-09-09"
description = """Assistant synthesis of the user-directed recovered vision; implementation and economic advantage require \
  separate evidence."""

[[payload.origin]]
kind = "document"
locator = "git:4ae2774b8d84359fbfdb5d20e7c276b5cff41d18:PROJECTOR_SPEC/04-governance/lenses.md"
contentHash = "sha256:v1:89c8df1e703b614587c9a2db2afb2b80f4bb8d3bff3696fd724880519c3faf57"
description = "Historical proposal supporting this meaning; not automatic authority."
