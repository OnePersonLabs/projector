#:schema ../../schemas/canonical-requirement-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "requirement"
id = "requirement:pre-edit-relevance"
key = "pre-edit-relevance"
lifecycle = "active"

[payload]
title = "Determine relevance before choosing edits"
aliases = [ "relevance before editing", "request-first context" ]
statement = """Given a requested outcome, retrieve existing meaning, constraints, decisions, and distant consumers \
  before choosing implementation paths. Traverse typed canonical relations and implementation bindings \
  with explicit reasons and bounds. Distinguish candidate interpretations and unknown frontiers from \
  confirmed identity or absence. Post-edit impact analysis does not replace this step."""
sourceClass = "authored"
evidence = []

