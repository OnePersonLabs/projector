#:schema ../../schemas/canonical-requirement-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "requirement"
id = "requirement:reverse-reconciliation"
key = "reverse-reconciliation"
lifecycle = "active"

[payload]
title = "Reconcile changes made outside Projector"
aliases = [ "reverse reconciliation", "planning surprises" ]
statement = """After arbitrary repository edits, compare current observations with retained bindings, predicted impact \
  and applicable lens obligations. Report stale reasoning separately from actual architectural violations. \
  Accept alternate conforming implementations. Surface unexpected consumers, changed membership, violated \
  assumptions and observed impact beyond the plan. Retain Planning Surprises and candidate relationships \
  as state-bound derived evidence with a concrete repair route; explicit acceptance is required before \
  inferred relationships become authoritative. Successful controlled changes authenticate their post-observation \
  evidence; host edits do not acquire a controlled-execution certificate."""
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/engine/src/reconciliation/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/engine/src/relevance/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge-governance.ts"

[[payload.origin]]
kind = "user-request"
locator = "projector-recovered-premise:2026-09-09"
description = """Assistant synthesis of the user-directed recovered vision; implementation and economic advantage require \
  separate evidence."""

[[payload.origin]]
kind = "document"
locator = "git:4ae2774b8d84359fbfdb5d20e7c276b5cff41d18:PROJECTOR_SPEC/06-reconciliation/reconciliation-and-divergence.md"
contentHash = "sha256:v1:aa322881e51538f7a9ec4a3c4a3195d50c495faf14ee598f03eb9288e22f8856"
description = "Historical proposal supporting this meaning; not automatic authority."

[[payload.origin]]
kind = "user-request"
locator = "conversation:2026-09-09:architectural-reasons-and-harness-assimilation"
description = """The user explicitly requires architectural choices, rejected options and reasons to survive, and requests \
  useful harness practices be assimilated without flattening Projector into instructions."""

[[payload.origin]]
kind = "external"
