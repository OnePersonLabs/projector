[payload]
title = "Reconcile changes made outside Projector"
aliases = [ "reverse reconciliation", "planning surprises" ]
statement = """After arbitrary repository edits, compare current observations with retained bindings, predicted impact \
  and applicable lens obligations. Report stale reasoning separately from actual architectural violations. \
  Accept alternate conforming implementations. Surface unexpected consumers, changed membership, violated \
  assumptions and observed impact beyond the plan. Retain Planning Surprises and candidate relationships \
  as state-bound derived evidence with a concrete repair route; explicit acceptance is required before \
  inferred relationships become authoritative. Successful controlled changes authenticate their post-observation \
  evidence; host edits do not acquire a controlled-execution certificate.

The bounded control loop must compare post-change observation with predicted impact, classify scope \
  growth, missing relationships, and overreach, and reach a fixed point or report the unresolved frontier. \
  It may propose a reusable relation from observed surprise evidence but must never learn or authorize \
  a false relation from unrelated edits.

Choose repairs in this order, recording why cheaper or safer strategies are unavailable or insufficient: \
  reuse when an eligible exact or validated signature permits backdating; revalidate when a validator \
  establishes sufficient proof; repair upstream and regenerate a generated unit with known upstream \
  source and generator; apply a safe reversible deterministic patch to a non-generated governed unit; \
  use bounded agent repair for shared handwritten semantics only when policy allows; widen analysis \
  when coverage or proof is insufficient; otherwise request a human decision. This ordering depends \
  on scoped invalidation and evidence-bound completion rather than a mapping alone.

Direct edits to generated output or a Representation Projection with a known generator or source are \
  forbidden by default. Normally repair upstream canonical semantics or the representation profile, \
  regenerate, and validate both the generated result and semantic preservation. A temporary generated-output \
  overlay is allowed only as an explicit migration or debt record with owner, rationale, invalidation \
  conditions, and exit criteria. Keep the exception and its removal conditions visible.

Full ordered repair selection, explanations, and overlay handling remain active but explicitly unrealized \
  as public routing by this ingestion. Reconsider when the host-owned investigate, propose, accept, \
  repair, verify loop or cleanup workflow must select among these strategies and expose the rejected \
  cheaper alternatives. Bind only an observed selector and explanation consumer; existing strategy enums \
  and recovery types do not prove this policy is implemented.

Recovery distinguishes incomplete effects from committed-but-unpublished evidence. Preserve the last \
  durable checkpoint and authenticate required post-observation evidence; never rerun committed effects \
  just to republish an already committed result. Safe rollback or historical publication must not depend \
  on missing advisory preparation notes, and missing notes never justify fabricated prepared-success \
  evidence. Governed shared-state mutation follows cooperative worktree ownership; independently owned \
  observation artifacts do not acquire a new global writer lock from this obligation."""
sourceClass = "authored"
evidence = []

