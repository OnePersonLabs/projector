kind = "requirement"
id = "requirement:runtime-evidence-legibility"
key = "runtime-evidence-legibility"
lifecycle = "active"

[payload]
title = "Connect affected meaning to inspectable application behavior"
aliases = []
statement = """For application behavior that needs runtime observation, run the affected scenario in an identifiable \
  application test instance with owned setup and teardown, an allocated endpoint, fresh test state, \
  and explicit host trust assumptions. Give the host agent access to required browser input, logs, metrics, \
  traces and diagnostics using supported tools. Bind acceptance to the actual source/build/scenario/controller \
  state, collection method and freshness, retain diagnostics on failure or unavailable collection, and \
  keep outcome, operational status, currentness and assurance separate. Prefer a concrete application \
  adapter over a generic provisioning framework. Browser evidence does not prove acoustic, device, learning, \
  or other unobserved outcomes.

For every supported operation, report observed host capabilities rather than inferring them from a brand. \
  Record the available policy, configuration, toolchain, state, graph, analyzer, model, external, authority, \
  transform, validation, journal, duration, cancellation, bounded-output, and error facts. Invoke commands \
  with opaque argv rather than untrusted shell interpolation and declare cwd, reads, writes, network, \
  environment, time, resources, and side effects. Missing host controls remain explicit; ordinary host \
  execution is not confinement. The historical standalone CLI, wrapper-to-CLI chain, MCP catalog and \
  transport, and mandatory Projector-owned sandbox or WSL bridge are superseded delivery mechanisms \
  once installed callers use the shared runner and host execution. Do not retain their names as operational \
  shims. Preserve context, planning, exact approval, apply, recover, resume, reconciliation, and truthful \
  capability results through the shared runner.

Surface adapters disclose their real capabilities and enumeration limits; plan/apply/validate methods \
  are optional, and read-only or unavailable APIs must not fake writable implementations. External observations \
  are timestamped, adapter-versioned revisions. Deterministic comparisons pin the needed snapshot digest; \
  refreshing remote state creates a new revision and may invalidate dependent plans or derivations. \
  Live remote state is never silently part of a local rebuild. Missing required surfaces become explicit \
  frontier/manual actions. Open or sampled surfaces disclose blind spots and may support drift evidence, \
  but cannot prove claims requiring full enumeration. Broader adapters remain unrealized until a named \
  supported consumer has an owned observation lane, trust/capability boundary and acceptance need; this \
  does not defer the required installed application, continuation or currentness evidence."""
sourceClass = "authored"
evidence = []

