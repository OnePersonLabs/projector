#:schema ../../schemas/canonical-requirement-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "requirement"
id = "requirement:scoped-governance-exceptions"
key = "scoped-governance-exceptions"
lifecycle = "active"

[payload]
title = "Keep governance exceptions scoped and reviewable"
aliases = []
statement = """A governance exception is an explicit scoped deviation, not a rewrite of underlying authority to erase \
  a conflict. It must identify a stable ID/key, exact semantic selector, excepted rule/lens/expectation, \
  rationale, supporting evidence, owner, typed review or expiry trigger and invalidation conditions. \
  Remediation or exit criteria are optional. Prefer narrower semantic selectors; broad path-wide suppression \
  should be rejected when a narrower selector is available. Expired or invalidated exceptions re-enter \
  divergence evaluation.

The general acceptance, reevaluation and retirement workflow remains active but explicitly unrealized \
  by this ingestion. Reconsider when a supported change/reconciliation flow needs a real temporary deviation \
  and can demonstrate expiry/invalidation and any declared exit behavior. Do not create an exception \
  instance from generic design. Internal types and completion dispositions do not prove a connected \
  public lifecycle. Scope follows existing executable-governance and reconsideration meaning, not fabricated \
  implementation mappings."""
sourceClass = "authored"
realizations = []
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "requirement"
matcher = "equals"
value = "requirement:executable-lenses"

[[payload.scope.items]]
op = "atom"
field = "requirement"
matcher = "equals"
value = "requirement:scoped-reconsideration"

