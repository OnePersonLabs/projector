key = "scoped-invalidation"
lifecycle = "active"

[payload]
title = "Reuse knowledge with scoped invalidation"
aliases = [ "stale knowledge", "dependency-scoped reuse" ]
statement = """Bind retained reasoning and derived artifacts to the exact semantic values and query results they used, \
  including empty queries and selector membership. Traverse exact derivation dependencies before versioned \
  impact rules after a known delta; do not substitute pre-edit relevance for that dependency proof. \
  Reuse unaffected knowledge despite unrelated changes. Backdate only when the registered signature \
  profile proves all required preserved dimensions; unchanged structure does not prove behavioral equivalence \
  or waive required validation. Changed dependencies or new consumers invalidate affected reasoning. \
  Unknown profiles, missing baselines and open populations remain unknown and can be rebuilt without \
  making runtime caches canonical.

Bind mutation authority to the exact session, plan and approval hash, value and query dependencies, \
  operations, semantic and write scope, risk, expiry, and representation profile. A relevant changed \
  or unprovable dependency invalidates authority; an unrelated repository-root digest change triggers \
  validation and may rebind without blanket invalidation. Execution mode changes permission only and \
  cannot weaken meaning or proof. Stale approval cannot replay.

For mutating transforms, bind applicability, preconditions, touched units and write scope to dependency-scoped \
  state before preview and apply. Preserve composition dependencies and exclusive claims, fail on unresolved \
  semantic anchors or unresolved overlapping claims, and verify declared postconditions with structured \
  evidence. Apply the complete transform and convergence obligations of executable lenses and the upstream-first \
  repair discipline of reverse reconciliation. Public enforcement of the complete composition and repair \
  policy remains explicitly unrealized by this ingestion; reconsider it when a named supported planning \
  or repair consumer requires those decisions, rather than treating internal contracts or file mappings \
  as fulfillment.

Plans are immutable revisions: a changed plan receives a new identity rather than modifying what approvals \
  or packets reference. Partial execution preserves dependency integrity. Changed repository, canonical, \
  toolchain or external-snapshot state requires explicit refresh/rebase: recompute snapshot identity, \
  validate/rebind dependency-scoped state, identify still-valid assumptions and closures, recompile \
  stale capsules/packets, carry forward completed work only where its proof remains valid, emit a new \
  immutable revision and invalidate stale approvals. Canonical-governance conflicts block governed execution \
  until explicitly resolved; automatic semantic Git conflict resolution is not required.

If the global snapshot alone changed while bound dependencies and query fingerprints remain current, \
  a lightweight rebind may emit a new immutable revision without recomputing unaffected analysis. Explain \
  this separately from semantic rebase changing relevance, impact, assumptions or packets. Bounded saved-context/lifecycle \
  continuation and relevant query/profile currentness explanations that retain independently current \
  work remain required release behavior. Unrestricted multi-packet checkpoint orchestration beyond exercised \
  consumers remains explicitly unrealized; reconsider it when a real supported multi-packet plan loses \
  valid completed work or risks stale authority.

Risk is contextual, including uncertainty, unresolved identity/ownership, weak coverage or validation, \
  stale observations, open frontiers and limited rollback. Increased uncertainty must never reduce risk \
  or approval requirements. The highest-risk destructive, production-security, billing, identity or \
  irreversible-release actions are not autonomous. Actual authorization and host-configured permissions \
  still govern; historical risk tables do not create permission or revive Projector-owned confinement. \
  Conflicting policy inputs fail explicitly instead of relying on ambiguous precedence."""
sourceClass = "authored"
evidence = []

