kind = "requirement"
id = "requirement:scoped-reconsideration"
key = "scoped-reconsideration"
lifecycle = "active"

[payload]
title = "Reconsider architecture when its reasons change"
aliases = [ "architectural reconsideration", "assumptions and preferences" ]
statement = """Retain architectural decisions about patterns, libraries, platforms, boundaries and implementation strategy \
  together with alternatives, reasons, constraints, assumptions, evidence, tradeoffs and applicable \
  scope. Make the choice and why retrievable before affected edits and after a fresh clone. Reconsider \
  only affected decisions when those inputs or scope change; preserve the historical influence of adopted \
  soft preferences. New non-advisory consequences require actual linked canonical products in the same \
  accepted transaction. Neither an old approval nor repeating existing code proves that the decision \
  remains suitable. Unsupported or stale validity evidence stays explicit.

Agents and model providers may submit structured proposals but cannot silently promote governance, change \
  authority, validators or scope, persist exceptions, redefine identity, or perform highest-risk or \
  external actions. General orchestration, modernization, watch mode, and external adapters remain future \
  capabilities until a real consumer reopens them; external adapters then require explicit capability, \
  observability, relevance, impact, drift, snapshot, and open-world evidence.

Material mutable option sets or constraints require fresh-enough concern-scoped evidence: current capabilities, \
  support/security/lifecycle, changed alternatives, uncertain official constraints, contradictory local \
  evidence or significant long-lived technology commitments. Verify the current viable options, not \
  remembered choices decorated with citations. Do not research merely because time passed or perform \
  a periodic repository-wide best-practices crawl. Record source, capture date, available source date/version, \
  excerpt hash or concise excerpt, confidence and applicability; prefer official/primary evidence. Offline \
  cached evidence exposes freshness. If policy requires unavailable fresh evidence for a blocking decision, \
  block automatic acceptance; an explicit user decision may proceed with recorded uncertainty within \
  actual authorization and remaining hard constraints. Research does not prove local implementation \
  or force migration.

Hard constraints dominate preferences; explicitly adopted project preferences govern shared recommendations \
  over softer organization/user preferences. Conflicting soft preferences remain visible and nonblocking \
  unless explicitly promoted into constraints. Retain material preference influence by semantic hash; \
  later personal changes do not retroactively revise accepted project architecture unless adopted as \
  assumptions. Option evaluation should use a tradeoff matrix and eliminate infeasible options before \
  optional weighted ranking; expose weights rather than claiming objective probability. Deferral needs \
  a neutral/compatibility-preserving route, rationale, scope, preserved options, forbidden commitments, \
  revisit triggers and risk/unknowns. A guardrail that commits to an option is a temporary decision, \
  not concealed neutrality.

Modernization uses this same concern/evaluation/authority/consequence system. Trigger it from observed \
  divergence, agent difficulty, surprises/missed relevance, broad invalidation, duplication, unsupported \
  dependencies, security/support issues, slow feedback, erosion, repeated overlays, platform incompatibility \
  or user request. Identify the problem before technology, with current/target state, observed cost, \
  alternatives, evidence/counterevidence, affected meaning/relevance/units, compatibility, phases, rollback, \
  cleanup, risk and confidence. Reject fashion-driven changes when current fit costs less, support is \
  immature, migration exceeds recurring pain, scale benefits are speculative, rationale mismatches local \
  constraints, or reversibility/evidence is weak. Approved modernization becomes a semantic change with \
  appropriate transition obligations; it is not persisted-format upgrade readiness."""
sourceClass = "authored"
evidence = []

