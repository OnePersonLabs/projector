#:schema ../../schemas/canonical-requirement-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "requirement"
id = "requirement:self-hosted-value"
key = "self-hosted-value"
lifecycle = "active"

[payload]
title = "Demonstrate cumulative value on Projector itself"
aliases = [ "self-hosting", "ordinary-agent baseline", "knowledge economics" ]
statement = """Use Projector knowledge to guide a real change and a subsequent change in a fresh session, detect deliberately \
  stale knowledge, and compare the combined setup, retrieval, repair, and maintenance cost with a capable \
  ordinary agent using search, code, tests, and concise notes. Passing self-authored tests does not \
  prove economic advantage. Retire historical planning material only after useful intent and rationale \
  are recoverable through the working system."""
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/cli/src/knowledge-cli.test.ts"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "scripts/knowledge-acceptance.mjs"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/skills/**"

[[payload.origin]]
kind = "user-request"
locator = "projector-recovered-premise:2026-09-09"
description = """Assistant synthesis of the user-directed recovered vision; implementation and economic advantage require \
  separate evidence."""

[[payload.origin]]
kind = "document"
locator = "git:4ae2774b8d84359fbfdb5d20e7c276b5cff41d18:PROJECTOR_SPEC/12-delivery/release-and-directive.md"
contentHash = "sha256:v1:36a09c0f0a1b46f1ced70e45bf0d04c40e35f1618232eead2a6eca880d63b727"
description = "Historical proposal supporting this meaning; not automatic authority."
