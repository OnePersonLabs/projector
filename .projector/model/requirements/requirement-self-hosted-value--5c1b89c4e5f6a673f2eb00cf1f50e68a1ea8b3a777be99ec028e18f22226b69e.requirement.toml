[payload]
title = "Demonstrate cumulative value on Projector itself"
aliases = [ "self-hosting", "ordinary-agent baseline", "knowledge economics" ]
statement = """Use Projector knowledge to guide a real change and a subsequent change in a fresh session, detect deliberately \
  stale knowledge, and compare the combined setup, retrieval, repair, and maintenance cost with a capable \
  ordinary agent using search, code, tests, and concise notes. Passing self-authored tests does not \
  prove economic advantage. Retire historical planning material only after useful intent and rationale \
  are recoverable through the working system.

Measure the semantic machinery itself, including cache behavior, invalidation and backdating, identity \
  and relevance quality, context and representation cost, deterministic mutation, rollback, analyzer \
  limits, and benchmark outcomes. The goal is lower marginal reasoning and review cost; model growth \
  faster than useful application is debt. Do not fabricate absent measures as zero. Release remains \
  manual, source-independent, and non-publishing until an explicit later action; passing self-authored \
  tests or a historical checklist does not prove economic advantage or full release completeness.

Where feasible, inferred enforcement should be evaluated against repository history and semantic perturbations \
  before activation. Check independent persistence of examples, later fixes/co-change/migration direction, \
  shared ancestry, alternative explanations from tests/incidents, intentional variants and nearby generated \
  cases. Separate exogenous evidence from changes caused by Projector: a migration demanded by a lens \
  cannot independently support that lens. Shadow evaluation reports true positives, intentional variants \
  wrongly flagged, possible prevented defects, transform applicability and false positives; pair small-sample \
  percentages with counts and uncertainty. Evaluation never silently changes governance. Broad historical-evaluation \
  automation remains unrealized until a named consumer and trustworthy history/perturbation evidence \
  justify it; required release controls and actual source-absent self-development measurements are not \
  deferred.

Reopen affected design when observed evidence shows maintenance cost near/exceeding ordinary review; \
  systematically missed dependencies despite claimed coverage; rebuild needing hidden history; overclaimed \
  signatures; correlated conformance missing shared bugs; governance cycles/ad hoc ordering; impractical \
  canonical collaboration; conflicts needing prompt surgery; ordinary instructions/codemods nearly matching \
  held-out results; repository-sized capsules; package-tree duplication for relevance; recurring synonymous \
  identities; unsafe or globally stale bindings; lossy or net-negative representation; reduced task \
  success from compression; endogenous authority dominance; unactionable divergence; routine forbidden \
  generated-output patches; dishonest interruption recovery; adoption needing manual ontology authoring; \
  or growing model/rule complexity without declining marginal reasoning/review cost. These are evidence-driven \
  design feedback, not defects to hide with more rules or relabel as optional. They do not require a \
  new economic trial, universal superiority proof or completed Psychord rebuild before delivery; use \
  the already required real-work measurements and disclose missing evidence.

If a correction/shadow-lens decision uses paired probes, specify both expected outcomes independently; \
  both must be correct. Count invalid pairs and oracle errors separately.

Comparative claims require matched initial states, equal tasks/tools/models/resources/reveals, accumulated \
  code preserved through fresh-agent checkpoints, and separate new-behavior/regression grading by predeclared \
  independent oracles. Retain failures, setup errors, timeouts, unavailable and aborted attempts. Report \
  observed setup, retrieval/context, model/tool, deterministic, evidence, human review/repair and canonical-maintenance \
  costs with units/pricing provenance; missing costs are unavailable. These are optional protocols, \
  not delivery prerequisites or required paid trials."""
sourceClass = "authored"
evidence = []

