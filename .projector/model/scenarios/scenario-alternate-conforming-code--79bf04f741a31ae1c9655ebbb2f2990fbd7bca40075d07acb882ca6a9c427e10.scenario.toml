[[payload.steps]]
role = "precondition"
statement = "An applicable active lens defines a predicate-constrained implementation boundary."

[[payload.steps]]
role = "trigger"
statement = "An ordinary agent changes the implementation without using a Projector transform."

[[payload.steps]]
role = "expected-outcome"
statement = """Current predicates determine conformance; changed source bindings may still make earlier reasoning stale."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """Projector demands canonical bytes from a predicate-constrained handwritten implementation or calls stale \
  reasoning a semantic violation."""

[[payload.steps]]
role = "precondition"
statement = """Additional acceptance case: Two structurally different handwritten implementations satisfy the same \
  active predicates and tests."""

[[payload.steps]]
role = "trigger"
statement = """Additional acceptance case: Two handwritten implementations satisfy the same active predicates and tests \
  but are structurally different."""

[[payload.steps]]
role = "expected-outcome"
statement = """Additional acceptance case: a `predicate-constrained` expectation accepts both. Projector does not invent \
  one exact canonical body and flag the other as divergent."""

[[payload.steps]]
role = "precondition"
statement = """Adversarial evaluation must exercise this class and reject false success: Multiple valid handwritten \
  implementations."""

[[payload.steps]]
role = "expected-outcome"
statement = "Property across the applicable input population: hard-rule composition is order-independent."

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: selector/lens/rule applicability is deterministic for \
  fixed dependencies."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: typed rule predicate composition/conflicts."

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: lens overlap/composition."

