[[payload.steps]]
role = "precondition"
statement = """Accepted semantic and governance records are independently addressable; derived SQLite and caches exist."""

[[payload.steps]]
role = "trigger"
statement = """Create independently addressable canonical files for accepted Concepts, Requirements, Behavioral Scenarios, \
  and authored Relations. Also create rules, an active lens/profile, authority record, decision, exception, \
  and migration. Delete `state.db` and caches."""

[[payload.steps]]
role = "expected-outcome"
statement = """all canonical authored/governance semantics reload identically. The deterministic canonical-root digest \
  is identical. Derived observations are recomputed. No hidden local run history or monolithic model \
  file is required."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: rebuilding SQLite from canonical inputs preserves semantic \
  state."""

[[payload.steps]]
role = "precondition"
statement = "Adversarial evaluation must exercise this class and reject false success: Canonical rebuild closure."

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: canonical serialization independent of object insertion \
  order."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: stable semantic hash excludes declared volatile metadata."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: deterministic derived IDs are stable across repeated \
  indexing."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: canonical serialization and schema-defined semantic hashing."

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: canonical schema migration."

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: Zod/public-contract registry completeness."

