field = "requirement"
matcher = "equals"
value = "requirement:scoped-reconsideration"

[[payload.steps]]
role = "precondition"
statement = """Forty generated packages share a weak pattern; two independent newer implementations and incidents support \
  a better pattern."""

[[payload.steps]]
role = "trigger"
statement = """Forty generated packages share a weak pattern. Two independently authored newer implementations use \
  a better pattern, and incidents support the latter. Then let Projector normalize several packages \
  under the proposed lens."""

[[payload.steps]]
role = "expected-outcome"
statement = """- forty generated copies collapse into one independence group.
- Projector-normalized copies do not become independent votes for the same lens.
- dominant descriptive precedent is not automatically normative.
- a migration recommendation requires the stronger independent evidence and approval appropriate to \
  risk."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: a Projector-caused conforming occurrence never becomes \
  independent support for its causal lens/rule."""

[[payload.steps]]
role = "precondition"
statement = """Adversarial evaluation must exercise this class and reject false success: Projector-endogenous authority \
  evidence."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: authority independence and reconsideration triggers."

