[[payload.steps]]
role = "precondition"
statement = """Structurally varied repositories contain held-out pattern-preserving and pattern-breaking mutations \
  not encoded in fixture-specific detectors."""

[[payload.steps]]
role = "trigger"
statement = """Generate structurally varied repositories from pattern-preserving and pattern-breaking mutations not \
  directly encoded in fixture-specific detectors."""

[[payload.steps]]
role = "expected-outcome"
statement = """reported precision/recall and completeness behavior remain within release thresholds, showing generalization \
  beyond golden fixture memorization."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """This bounded existing held-out/mutation acceptance case is expanded into a mandatory new economic trial, \
  paid-model comparison or universal generalization proof before delivery."""

[[payload.steps]]
role = "precondition"
statement = """Adversarial evaluation must exercise this class and reject false success: Mutation-generated near misses."""

[[payload.steps]]
role = "expected-outcome"
statement = """Training/development fixtures:

- `clean-monorepo`.
- `slop-monorepo`.
- `incomplete-refactor`.
- `copied-slop`.
- `cross-platform-product`.
- `external-surfaces`.
- `selector-membership`.
- `semantic-backdating`.
- `governance-cycle`.
- `transaction-crash`.
- `multiple-valid-implementations`.
- `generated-upstream`.
- `representation-semantic-drift`.
- `representation-token-economics`.
- `semantic-identity-overlap`.
- `cross-cutting-relevance`.
- `event-contract-relevance`.
- `scoped-state-binding`.
- `planning-surprise`.

Maintain **held-out** fixture repositories and mutation-generated variants whose exact anomalies are \
  not encoded as one-off detectors. Release metrics MUST include held-out performance."""

[[payload.steps]]
role = "expected-outcome"
statement = """Live-model/provider evaluation is opt-in, budgeted, reproducible at the input/program/schema level, \
  and graded structurally. It MUST NOT be the only test for semantic behavior."""

