#:schema ../../schemas/canonical-behavioral-scenario-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "behavioral-scenario"
id = "scenario:inspect-isolated-application-behavior"
key = "inspect-isolated-application-behavior"
lifecycle = "active"

[payload]
title = "Inspect application behavior in an owned test instance"
aliases = []
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/integrations/src/runtime-evidence/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/skills/**"

[[payload.steps]]
role = "precondition"
statement = """An application adapter declares an identifiable build and endpoint, owned setup and teardown, fresh \
  test state, controller and fixture inputs, and explicit host trust assumptions."""

[[payload.steps]]
role = "trigger"
statement = "An affected user-facing scenario runs against the current repository and served application state."

[[payload.steps]]
role = "expected-outcome"
statement = """The host agent inspects actual browser and runtime observations, and acceptance identifies scenario, \
  source/build/endpoint/controller state, collection method, freshness, outcome, cleanup and assurance."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """Wrong-build or wrong-endpoint observations, contaminated prior state, missing or unavailable collection, \
  failed setup, interrupted cleanup, or a stored promise are reported as successful behavioral proof; \
  browser evidence is used to claim unobserved acoustic, device, or learning outcomes."""

[[payload.steps]]
role = "expected-outcome"
statement = """For a supported Psychord adapter, the review skill invokes application.observe with a plan bound to \
  the intended repository and observes the returned outcome, freshness, owned artifacts and cleanup \
  before citing scenario evidence."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """A registered handler, unavailable observation or unconsumed artifact is counted as successful application \
  behavior."""

[[payload.origin]]
kind = "user-request"
locator = "conversation:2026-09-13:complete-existing-projector-control-loop"
description = """The user approved explicit skill, hook, runner, and service ownership; selector-based continuation; \
  installed consumption and recovery verification."""
