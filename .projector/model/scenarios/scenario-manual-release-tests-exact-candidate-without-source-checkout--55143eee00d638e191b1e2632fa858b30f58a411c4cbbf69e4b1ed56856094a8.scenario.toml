[[payload.steps]]
role = "precondition"
statement = "A manual release workflow builds one authenticated candidate for a source-severed test job."

[[payload.steps]]
role = "trigger"
statement = "Inspect the repository release workflow and run its source-severed lane on the pinned Ubuntu runner."

[[payload.steps]]
role = "expected-outcome"
statement = """`workflow_dispatch` is the only trigger. A build job performs dogfooding, verification, artifact checks, \
  and creation of one authenticated candidate without requiring a Projector sandbox backend."""

[[payload.steps]]
role = "expected-outcome"
statement = """A fresh job with no checkout downloads that candidate and provisions its isolated release-test harness. \
  It installs the exact tarball and plugin and runs packed acceptance. Harness isolation is evidence \
  about source severance, not a Projector runtime guarantee. The job uploads the exact tested artifacts \
  and evidence. The traceability manifest binds this scenario to an observed public test."""

