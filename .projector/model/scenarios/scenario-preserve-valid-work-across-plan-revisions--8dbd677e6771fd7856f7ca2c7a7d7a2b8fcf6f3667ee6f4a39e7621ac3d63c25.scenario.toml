statement = "Script/hook architecture is partly resolved and execution stops before the repository changes."

[[payload.steps]]
role = "trigger"
statement = "Resolve only script/hook architecture, stop, then modify the repository before resuming."

[[payload.steps]]
role = "expected-outcome"
statement = """settled canonical decisions persist. If the intervening change touches a bound dependency, the old plan \
  cannot blindly resume and `plan rebase` carries forward still-valid completed work into a new revision/capsules. \
  If only unrelated snapshot state changed and every StateBinding dependency/membership fingerprint \
  is unchanged, Projector can perform a lightweight rebind without recomputing unaffected semantic work."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: plan rebase."

