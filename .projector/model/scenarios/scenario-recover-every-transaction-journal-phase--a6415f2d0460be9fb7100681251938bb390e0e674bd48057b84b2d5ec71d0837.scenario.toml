[[payload.steps]]
role = "precondition"
statement = "A controlled transaction has journal phases and affects workspace and canonical state."

[[payload.steps]]
role = "trigger"
statement = """Inject process failure after every transaction journal phase: prepared, during workspace mutation, staged, \
  validating, canonical staging, commit, rollback."""

[[payload.steps]]
role = "expected-outcome"
statement = """restart either resumes safely, rolls back, or reports `recovery-required`. Canonical state never claims \
  a transaction completed when workspace state is partial."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: rollback restores fixture-supported physical and canonical \
  state."""

[[payload.steps]]
role = "precondition"
statement = """Adversarial evaluation must exercise this class and reject false success: Crash at every semantic transaction \
  phase."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: transaction journal/recovery."

