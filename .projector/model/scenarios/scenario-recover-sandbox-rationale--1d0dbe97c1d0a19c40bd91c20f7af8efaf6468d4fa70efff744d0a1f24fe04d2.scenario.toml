#:schema ../../schemas/canonical-behavioral-scenario-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "behavioral-scenario"
id = "scenario:recover-sandbox-rationale"
key = "recover-sandbox-rationale"
lifecycle = "active"

[payload]
title = "Recover the host-execution decision after a fresh start"
aliases = []
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/runtime/src/execution/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/change-lifecycle/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/knowledge/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/coverage/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/cli/src/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/scripts/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "plugins/projector/hooks/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "equals"
value = "scripts/build-plugin-runtime.mjs"

[[payload.steps]]
role = "precondition"
statement = """The project is cloned or the agent starts a new session before changing a validator, approval path, \
  coverage operation, packaged runner, or launcher."""

[[payload.steps]]
role = "trigger"
statement = "The agent requests current Projector context for the affected host-execution change."

[[payload.steps]]
role = "expected-outcome"
statement = """Context exposes the native host-execution decision, retained source/state/version/authorization/cancellation/recovery \
  guarantees, trust limits, prior rejected confinement routes, and typed reconsideration conditions."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """The agent silently restores mandatory Projector confinement or claims that ordinary host execution enforces \
  denied network, hidden paths, immutable overlays, quotas, or hostile same-user protection."""
