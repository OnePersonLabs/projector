#:schema ../../schemas/canonical-behavioral-scenario-v2.schema.json
apiVersion = "projector/v2"
schemaVersion = "2.0.0"
kind = "behavioral-scenario"
id = "scenario:reopen-completion-obligation"
key = "reopen-completion-obligation"
lifecycle = "active"

[payload]
title = "Reopen only the completion issue affected by new facts"
aliases = []
sourceClass = "authored"
evidence = []

[payload.scope]
op = "any"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/control-plane/src/coverage/**"

[[payload.scope.items]]
op = "atom"
field = "path"
matcher = "glob"
value = "packages/cli/src/coverage-cli.test.ts"

[[payload.steps]]
role = "precondition"
statement = "A scoped issue was settled by accepted meaning or a valid explicit deferral."

[[payload.steps]]
role = "trigger"
statement = "A subsequent change adds an unmapped member or violates a governing rule."

[[payload.steps]]
role = "expected-outcome"
statement = """Completion identifies the affected obligation with stable identity, new evidence and a repair route \
  while unrelated settled issues remain settled."""
