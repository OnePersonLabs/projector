[payload]
title = "Architecture expansion: web app → cross-platform product"
aliases = [ "scenario:57:architecture-expansion-web-app-cross-platform-product" ]
sourceClass = "authored"
realizations = []
evidence = []

[payload.scope]
op = "atom"
field = "requirement"
matcher = "equals"
value = "requirement:scoped-reconsideration"

[[payload.steps]]
role = "precondition"
statement = """Acceptance case \"Architecture expansion: web app → cross-platform product\": the source fixture and \
  declared dependencies are available; this case does not imply implementation or proof."""

[[payload.steps]]
role = "trigger"
statement = """Start from a coherent single web application with no reason to carry monorepo/platform machinery. Request \
  desktop, Android, and iOS targets."""

[[payload.steps]]
role = "expected-outcome"
statement = """1. Requirement intent records new target capabilities, not a preselected stack.
2. Projector activates material concerns including workspace topology, cross-platform runtime/shared-code \
  boundary, dependency coherence, API contract, build/test/release, and distribution obligations.
3. It does **not** require every concern immediately. Projector classifies concerns as `blocking-now`, \
  `material-soon`, or `deferable` for the requested slice.
4. Prior web decisions remain valid for web unless their assumptions actually changed.
5. Volatile technology options are checked against current official/authoritative evidence before recommendation.
6. Pnpm workspace catalog capability, if pnpm is a viable selected package manager, may be evaluated \
  for dependency-version coherence rather than packages independently drifting. It is not mandated independently \
  of the decision.
7. Task orchestration is evaluated as a concern, but Nx/Turbo/another orchestrator is not adopted merely \
  because the repository became a monorepo. \"plain workspace scripts are sufficient for now\" is a \
  valid decision with reconsideration triggers.
8. User/org/project preferences influence only otherwise viable choices and the material influence is \
  shown.
9. Accepted decisions compile their rules/lenses/migrations transactionally.
10. Implementation planning starts only after the blocking decision frontier is resolved or validly \
  deferred."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: Architecture Concern materiality, promotion, and causal deduplication."

