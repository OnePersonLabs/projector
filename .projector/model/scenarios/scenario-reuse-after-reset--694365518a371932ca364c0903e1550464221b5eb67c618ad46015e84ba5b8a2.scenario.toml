  every decision."""

[[payload.steps]]
role = "precondition"
statement = """Acceptance case \"Unrelated canonical change does not stale local work\": the source fixture and declared \
  dependencies are available; this case does not imply implementation or proof."""

[[payload.steps]]
role = "trigger"
statement = """Compile an Execution Capsule for a MIDI change. Then change an unrelated avatar Requirement, causing \
  the global canonical-root digest to change."""

[[payload.steps]]
role = "expected-outcome"
statement = """- Projector notices the global snapshot changed.
- all bound semantic/physical/query dependencies for the MIDI capsule are unchanged.
- the binding is safely rebound or remains usable according to policy without recomputing the MIDI semantic \
  plan.
- global snapshot identity remains different and receipts still distinguish the snapshots."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: unrelated canonical/worktree changes do not invalidate \
  a `StateBinding` whose value dependencies and query-result fingerprints remain unchanged."""

[[payload.steps]]
role = "precondition"
statement = """Adversarial evaluation must exercise this class and reject false success: Unrelated root-state mutation \
  incorrectly staling scoped work."""

[[payload.steps]]
role = "expected-outcome"
statement = """Unit evaluation must cover: dependency-scoped `StateBinding` validation/rebinding after unrelated root \
  changes."""

