key = "validate-trusted-host-source-and-execution-bounds"
lifecycle = "active"

[payload]
title = "Trusted host validator integrity"
aliases = [ "scenario:16:trusted-host-validator-integrity", "property:13:increasing-uncertainty-cannot-lower-approval-risk-requirements" ]
sourceClass = "authored"
realizations = []
evidence = []

[payload.scope]
op = "atom"
field = "requirement"
matcher = "equals"
value = "requirement:scoped-invalidation"

[[payload.steps]]
role = "precondition"
statement = """A pinned tracked validator and its compiled Git/content identity are available on native Windows and \
  direct WSL."""

[[payload.steps]]
role = "trigger"
statement = """Run a pinned tracked validator through the native host on Windows and direct WSL. Exercise a denied \
  host launch, a failing validator, a changed source before execution, source drift during execution, \
  caller cancellation, timeout, and output exhaustion."""

[[payload.steps]]
role = "expected-outcome"
statement = """Projector launches only the exact resolved source whose bytes match the compiled Git/content identity. \
  It rechecks those bytes afterward and enforces time, output, and cancellation bounds. It records the \
  observed result and host assumptions separately. Denied launch and every failed, changed, interrupted, \
  or cleanup-unconfirmed case cannot establish conformance. No output claims filesystem confinement, \
  network denial, immutable overlays, or hostile same-user protection."""

[[payload.steps]]
role = "expected-outcome"
statement = """Property across the applicable input population: increasing uncertainty cannot lower approval/risk requirements."""

[[payload.steps]]
role = "expected-outcome"
statement = """Monotonic normalized risk/approval requirements operate within actual authenticated authorization and \
  accepted host policy. Increased uncertainty is not permission to invent a mandatory new human prompt, \
  confinement requirement, or hostile-writer guarantee."""

[[payload.steps]]
role = "expected-outcome"
statement = "Unit evaluation must cover: risk/policy normalization."

