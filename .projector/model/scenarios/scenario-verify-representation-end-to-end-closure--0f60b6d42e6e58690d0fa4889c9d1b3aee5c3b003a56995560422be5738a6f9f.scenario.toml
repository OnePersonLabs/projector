field = "requirement"
matcher = "equals"
value = "requirement:engineering-english"

[[payload.steps]]
role = "precondition"
statement = """The exact packed Projector artifact and an authenticated semantic change are available; representation \
  closure evaluates the complete composed subsystem rather than only compact rendering or operation \
  reachability."""

[[payload.steps]]
role = "trigger"
statement = """Run the public packed Projector artifact through the Representation closure contract. Compile an authenticated \
  semantic change. Attach the selected projection to its Execution Capsule. Consume the exact artifact \
  through the supported host and registered bundled-operation representation handler. Change the profile \
  and reconcile every dependent projection, context, and capsule. Observe dedicated fidelity, fallback, \
  and instruction-efficiency telemetry."""

[[payload.steps]]
role = "expected-outcome"
statement = """all seven stable `representation.*.v1` closure obligations have revision- and worktree-bound positive \
  evidence. Each obligation also has a negative control that rejects a severed edge. The subsystem remains \
  open if projection composition is missing or host instructions are free-form. A generic content reader, \
  skipped refresh, document-parse coverage proxy, or default zero release metric also blocks release."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """Registered handler presence, a fixed closure boolean, fabricated positive/negative observations, or \
  a test-binding remap is used as evidence that the representation edges were exercised."""

