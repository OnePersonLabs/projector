[[payload.steps]]
role = "precondition"
statement = """The installed Projector artifact and a concrete planned change are available. Accepted meaning and the \
  relevant execution authority, profile and dependency bindings can be inspected."""

[[payload.steps]]
role = "trigger"
statement = """Exercise public capture, plan and representation inspection. Check that the exact selected instructions \
  match their change and capsule. Validate fidelity and explicit fallback behavior. Change a relevant \
  profile or dependency and reconcile affected projections, context and capsules before reuse. Use a \
  real installed host exercise to observe delivery and the resulting action."""

[[payload.steps]]
role = "expected-outcome"
statement = """Direct behavioral checks reject wrong associations, altered instruction bytes, stale authority and missing \
  required artifacts. Profile reconciliation preserves historical records and creates no automatic approval. \
  Applicable recovery checks preserve unfinished work. Relevant fidelity and telemetry failures remain \
  observable. One coherent installed workflow covers host wiring; existing checks may be reused when \
  their relevant dependencies are unchanged. Required failures remain blocking, while missing procedural \
  certificates do not create a new product obligation."""

[[payload.steps]]
role = "forbidden-outcome"
statement = """A registered handler, content hash, fabricated observation, self-authored certificate or test-binding \
  remap substitutes for exercising the required behavior. Correct delivery is claimed as proof of agent \
  understanding. A cheaper method silently drops a consequential failure protection. Universal seven-stage \
  receipt collection or repeated unchanged host certification is imposed solely because a previous procedure \
  required it."""

