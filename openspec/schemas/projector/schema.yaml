name: projector
version: 1
description: Nested requirements and design decisions with a verified implementation loop.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Intended behavior and affected concerns
    template: proposal.md
    requires: []
  - id: specs
    generates: specs/**/spec.md
    description: OpenSpec requirement deltas
    template: spec.md
    requires: [proposal]
  - id: designs
    generates: designs/**/design.md
    description: Exact nested Projector design deltas
    template: design.md
    requires: [specs]
  - id: tasks
    generates: tasks.md
    description: Concrete change-specific work and verification outcomes
    template: tasks.md
    requires: [proposal]
    instruction: Review applicable accepted requirements and designs before writing tasks; complete necessary authority deltas first. Existing authority can support work without new design deltas. Write concrete tasks in dependency order, each with work and a checkable outcome. Include specific verification work when needed, not a general workflow checklist. Check only completed work. The shared verify skill owns procedure. For legitimate work without specification deltas, set skip_specs in metadata and preserve existing authority.
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: Use the installed $projector:apply skill to implement the reviewed plan in the selected checkout, then $projector:verify and $projector:finish for executed evidence, independent review and integrated completion. Request isolated workspace mode only when isolation is useful.
